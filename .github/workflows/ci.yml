name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm lint

      - name: Core engine tests
        run: npx vitest run src/lib/agents

      - name: SDK tests
        run: npx vitest run packages/sdk

      - run: pnpm build

      - name: Build SDK package
        run: pnpm --filter @sentinel-hq/sdk build
